[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autocontigmap"
version = "0.3.2"
description = "Estimate RFdiffusion contig gap sizes for a motif PDB from real PDB residue-count-vs-Ca-distance statistics."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "biopython",
    "numpy",
]

[project.scripts]
autocontigmap = "autocontigmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autocontigmap.data" = ["*.pkl"]
